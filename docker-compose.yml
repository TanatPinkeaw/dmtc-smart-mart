version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: pos_mysql
    restart: always
    environment:
      # ⭐️ Security remediation — เดิมฮาร์ดโค้ด อ่านจาก .env แทน (มี fallback เผื่อ local dev ยังไม่ตั้งค่า)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpassword}
      MYSQL_DATABASE: pos_coop
    ports:
      - "3306:3306"
    # บังคับให้รองรับภาษาไทย 100%
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: